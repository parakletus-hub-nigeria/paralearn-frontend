name: SEO gate

# Builds the app, boots it, and runs scripts/seo-gate.mjs against it. This is
# the G_gate check made durable: a page that fails crawlability/indexability
# cannot merge, no matter how good everything else about it is. See
# scripts/seo-gate.mjs for what's actually checked.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  seo-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          K12_BACKEND_URL: ${{ secrets.K12_BACKEND_URL || 'http://localhost:4000' }}
          UNI_BACKEND_URL: ${{ secrets.UNI_BACKEND_URL || 'http://localhost:3001' }}

      - name: Start server
        run: nohup npm run start -- -p 3000 > server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          cat server.log
          exit 1

      - name: Run SEO gate
        run: npm run seo:gate
        env:
          BASE_URL: http://localhost:3000

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
